[project]
name = "lumina"
version = "0.1.0"
description = "An educational tool that transforms PDFs into structured learning materials using Gemini AI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.42.6",
    "fastapi[standard]>=0.124.0",
    "google-genai>=1.54.0",
    "langchain>=1.1.3",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.0.0",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.26.7",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.44",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "ruff>=0.14.8",
]
