# Continuous integration: runs on every pull request, and is reused as the
# quality gate by deploy.yml (via workflow_call) before anything ships.
name: CI

on:
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend · fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  frontend:
    name: Frontend · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pre-existing lint findings (mostly `any` types) are reported but do not
      # block the pipeline yet. Flip continue-on-error to false once cleaned up.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck and build
        run: pnpm build
        env:
          # Placeholder for the CI build; the production bundle is built in
          # deploy.yml with the real VITE_API_URL.
          VITE_API_URL: http://localhost:8000
